[packages."dsh-desktop-unofficial".derive.yarnDepsHash]
strategy = "fod"
attr = ".#fetchrixPackages.\"dsh-desktop-unofficial\""
select = "shell.offlineCache"

[packages."dsh-workspace"]
pname = "dsh-workspace"
version = { source = "github-tag", repo = "deepseek-ai/deepseek-harness", strip_prefix = "dsh-v", filter = "^dsh-v[0-9]+\\.[0-9]+\\.[0-9]+.*$" }
fetch = { type = "github", repo = "deepseek-ai/deepseek-harness", tag = "dsh-v{version}" }

[packages."dsh-workspace".prepare]
steps = [{ type = "hook", run = ["./scripts/fetchrix-prepare.sh", "dsh-workspace"], inputs = ["scripts/generate-optional-bundles.sh"] }]
artifacts."pnpm-lock.json" = { type = "json", path = "pnpm-lock.yaml", format = "yaml" }
artifacts."pnpm-workspace.json" = { type = "json", path = "pnpm-workspace.yaml", format = "yaml" }
artifacts."optional-bundles.json" = { type = "file", path = ".fetchrix/optional-bundles.json" }
artifacts."client-commit.json" = { type = "file", path = ".fetchrix/client-commit.json" }
