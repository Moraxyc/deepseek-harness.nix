name: Sync Auto Update Branches

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Rebase and clean auto-update branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'

          open_prs="$RUNNER_TEMP/open-auto-update-prs.tsv"
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("auto-update/")) | [.number, .headRefName] | @tsv' \
            > "$open_prs"

          while IFS=$'\t' read -r pr_number branch; do
            if ! git fetch origin "$branch" >/dev/null 2>&1; then
              echo "Skipping missing branch for PR #$pr_number ($branch)"
              continue
            fi
            git switch -C "$branch" "origin/$branch"
            if git rebase origin/main; then
              git push --force-with-lease origin "HEAD:$branch"
              echo "Rebased PR #$pr_number ($branch)"
            else
              git rebase --abort
              echo "Skipping PR #$pr_number ($branch): rebase conflict"
            fi
          done < "$open_prs"

          for branch in \
            $(git for-each-ref --format='%(refname)' 'refs/remotes/origin/auto-update/' | sed 's#^refs/remotes/origin/##'); do
            if ! awk -F '\t' -v branch="$branch" '$2 == branch { found = 1 } END { exit !found }' "$open_prs"; then
              echo "Deleting stale auto-update branch $branch"
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            fi
          done
