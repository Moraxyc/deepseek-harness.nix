name: Merge Check

on:
  workflow_run:
    workflows: [Package CI, Docs]
    types: [completed]
    branches-ignore: [main]

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: merge-check-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

jobs:
  update:
    # The dsh-workspace auto-update pull request skips Package CI, so there is
    # no PR workflow result to publish.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_branch != 'auto-update/dsh-workspace'
    name: update
    runs-on: ubuntu-latest
    steps:
      # workflow_run has write access; never load code from the pull request.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Publish workflow result
        uses: actions/github-script@v9
        with:
          script: |
            const updateMergeCheck = require('./.github/scripts/merge-check.js');
            await updateMergeCheck({ github, context });
