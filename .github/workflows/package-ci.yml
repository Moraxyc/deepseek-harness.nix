name: Package CI

on:
  push:
    branches:
      - main
    # nix-fast-build --skip-cached skips derivations already in Cachix; only
    # skip changes that cannot affect a package or a CI script.
    paths-ignore: &docs-only
      - "**.md"
      - "docs-site/**"
      - "LICENSE"
      - ".github/renovate.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # x86_64-linux runs every check; the other systems build the package set so
    # Cachix also serves aarch64-linux and aarch64-darwin.
    name: Build package set${{ matrix.system != 'x86_64-linux' && format(' ({0})', matrix.system) || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Free disk space for Nix
        uses: wimpysworld/nothing-but-nix@v12

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # nothing-but-nix creates /nix/build on Linux only.
          extra_nix_config: |
            accept-flake-config = true
            ${{ runner.os == 'Linux' && 'build-dir = /nix/build' || '' }}

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'deepseek-harness-nix' }}
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Check CI scripts
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build --no-link \
            .#checks.x86_64-linux.merge-check \
            .#checks.x86_64-linux.dsh-bump-report \
            .#checks.x86_64-linux.publish-auto-updates

      - name: Check generated optional bundle manifest
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.dsh-optional-bundles-generated

      - name: Build package set
        run: |
          set -euo pipefail
          target="ciPackages"
          # Bundle loading smoke checks are architecture-independent; run them
          # on x86_64-linux only and keep packages, bundles, and presets everywhere.
          if [ "${{ matrix.system }}" = "x86_64-linux" ]; then
            target="ciTargets"
          fi
          nix run --inputs-from . nixpkgs#nix-fast-build -- \
            --flake ".#legacyPackages.${{ matrix.system }}.${target}" \
            --max-jobs 2 \
            --skip-cached \
            --no-nom \
            --eval-max-memory-size 2048

      - name: Check optional bundle composition and worktree runtime
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.dsh-optional-bundles \
            .#checks.x86_64-linux.dsh-worktree-runtime

      - name: Check bundle helper with nixpkgs 26.05
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build --no-link --print-build-logs \
            --inputs-from ./modules/flake-parts/dev \
            --override-input nixpkgs nixpkgs-2605 \
            .#checks.x86_64-linux.dsh-bundle-helper
