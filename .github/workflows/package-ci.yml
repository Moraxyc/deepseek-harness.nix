name: Package CI

on:
  push:
    branches:
      - main
    # select-package-ci-attrs decides what a change rebuilds; only skip
    # changes that cannot affect a package or a CI script.
    paths-ignore: &docs-only
      - "**.md"
      - "docs-site/**"
      - "LICENSE"
      - ".github/renovate.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths-ignore: *docs-only
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # x86_64-linux runs every check; the other systems build the package set so
    # Cachix also serves aarch64-linux and aarch64-darwin.
    name: Build package set${{ matrix.system != 'x86_64-linux' && format(' ({0})', matrix.system) || '' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: accept-flake-config = true

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'deepseek-harness-nix' }}
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name == 'pull_request' }}

      - name: Check CI scripts
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build --no-link \
            .#checks.x86_64-linux.merge-check \
            .#checks.x86_64-linux.package-ci-selection \
            .#checks.x86_64-linux.publish-auto-updates \
            .#checks.x86_64-linux.dsh-engines-update

      - name: Check generated optional bundle manifest
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.dsh-optional-bundles-generated

      - name: Build package set
        # macOS runners ship bash 3.2, which lacks mapfile and treats empty
        # arrays as unset under `set -u`.
        shell: nix shell --inputs-from . nixpkgs#bash --command bash -e {0}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] ||
             [ -z "$BASE_SHA" ] ||
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            attrs="$(nix run .#tools.select-package-ci-attrs)"
          else
            attrs="$(nix run .#tools.select-package-ci-attrs -- "$BASE_SHA")"
          fi
          if [ -z "$attrs" ]; then
            echo "No package attrs changed"
            exit 0
          fi

          mapfile -t build_attrs <<< "$attrs"
          printf 'Building %d package attrs\n' "${#build_attrs[@]}"
          printf '%s\n' "${build_attrs[@]}"
          nix build --no-link --print-build-logs "${build_attrs[@]}"

      - name: Check optional bundle composition and worktree runtime
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build --no-link --print-build-logs \
            .#checks.x86_64-linux.dsh-optional-bundles \
            .#checks.x86_64-linux.dsh-worktree-runtime

      - name: Check bundle helper with nixpkgs 26.05
        if: matrix.system == 'x86_64-linux'
        run: |
          nix build --no-link --print-build-logs \
            --inputs-from ./modules/flake-parts/dev \
            --override-input nixpkgs nixpkgs-2605 \
            .#checks.x86_64-linux.dsh-bundle-helper
