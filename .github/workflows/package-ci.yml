name: Package CI

on:
  push:
    branches:
      - main
    paths:
      - "pkgs/**"
      - "lib/**"
      - "overlays/**"
      - "flake.lock"
      - "flake.nix"
      - "default.nix"
      - "modules/flake-parts/**"
      - ".github/workflows/package-ci.yml"
      - "scripts/select-package-ci-attrs.sh"
  pull_request:
    paths:
      - "pkgs/**"
      - "lib/**"
      - "overlays/**"
      - "flake.lock"
      - "flake.nix"
      - "default.nix"
      - "modules/flake-parts/**"
      - ".github/workflows/package-ci.yml"
      - "scripts/select-package-ci-attrs.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package set
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: accept-flake-config = true

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'deepseek-harness-nix' }}
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Build package set
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] ||
             [ -z "$BASE_SHA" ] ||
             [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            attrs="$(scripts/select-package-ci-attrs.sh)"
          else
            attrs="$(scripts/select-package-ci-attrs.sh "$BASE_SHA")"
          fi
          if [ -z "$attrs" ]; then
            echo "No package attrs changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          mapfile -t build_attrs <<< "$attrs"
          printf 'Building %d package attrs\n' "${#build_attrs[@]}"
          printf '%s\n' "${build_attrs[@]}"
          nix build --no-link --print-build-logs "${build_attrs[@]}"

      - name: Check bundle helper with nixpkgs 26.05
        run: |
          nix build --no-link --print-build-logs \
            --inputs-from ./modules/flake-parts/dev \
            --override-input nixpkgs nixpkgs-2605 \
            .#checks.x86_64-linux.dsh-bundle-helper
