name: Package CI

on:
  pull_request:
    paths:
      - "pkgs/**"
      - "lib/**"
      - "overlays/**"
      - "flake.lock"
      - "flake.nix"
      - "default.nix"
      - "modules/flake-parts/**"
      - ".github/workflows/package-ci.yml"
      - "scripts/select-package-ci-attrs.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package set
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'deepseek-harness-nix' }}
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}

      - name: Build changed packages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
        run: |
          set -euo pipefail

          attrs="$(scripts/select-package-ci-attrs.sh "$BASE_SHA")"
          if [ -z "$attrs" ]; then
            echo "No package attrs changed"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"

          read -r -a build_attrs <<< "$attrs"
          nix build --no-link --print-build-logs "${build_attrs[@]}"
