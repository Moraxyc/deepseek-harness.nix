name: Auto Update

on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: accept-flake-config = true

      - name: Build update matrix
        id: discover
        run: |
          set -euo pipefail

          result="$(
            nix eval --impure --json --expr '
              let
                f = import ./default.nix;
                system = builtins.currentSystem;
                hasUpdateScript = p: (p.passthru or { }).updateScript or null != null;
                # nix-update refuses to evaluate broken packages, and package CI
                # skips them, so an update could not be validated before
                # auto-merge.
                isBuildable = p: !((p.meta or { }).broken or false);
                packageSet = builtins.getAttr system f.packages;
                legacyPackages = builtins.getAttr system f.legacyPackages;
                bundleSet = builtins.removeAttrs legacyPackages.bundles (
                  builtins.attrNames (import ./lib/removed-bundles.nix)
                );
                brokenButUpdatable = pkgSet: builtins.filter (
                  name:
                  hasUpdateScript (builtins.getAttr name pkgSet)
                  && !isBuildable (builtins.getAttr name pkgSet)
                ) (builtins.attrNames pkgSet);
                # Report the skips so a package cannot stay out of the matrix
                # unnoticed.
                skipped =
                  map (name: "packages." + name) (brokenButUpdatable packageSet)
                  ++ map (name: "bundles." + name) (brokenButUpdatable bundleSet);
                packages = builtins.filter (
                  name:
                  name != "pnpmWorkspaceDeploy"
                  && name != "dsh-desktop"
                  && isBuildable (builtins.getAttr name packageSet)
                  && hasUpdateScript (builtins.getAttr name packageSet)
                ) (builtins.attrNames packageSet);
                bundles = builtins.filter (
                  name:
                  isBuildable (builtins.getAttr name bundleSet)
                  && hasUpdateScript (builtins.getAttr name bundleSet)
                ) (builtins.attrNames bundleSet);
                toAttrs = labelPrefix: attrPrefix: names: pkgSet: map (name: {
                  inherit name;
                  attr = attrPrefix + "." + name;
                  label = if labelPrefix == "" then name else labelPrefix + "." + name;
                  version = (builtins.getAttr name pkgSet).version or "";
                }) names;
              in
              {
                inherit skipped;
                updatable =
                  (toAttrs "" ("packages." + system) packages packageSet)
                  ++ (toAttrs "bundles" ("legacyPackages." + system + ".bundles") bundles bundleSet);
              }
            '
          )"

          printf '%s\n' "$result" |
            jq -r '.skipped[] | "::warning::Skipping broken \(.) in the auto-update matrix"'

          matrix="$(
            jq -cn \
              --argjson result "$result" \
              '{
                include: ([
                  {
                    name: "flake-locks",
                    title: "chore: update flake locks",
                    command: "nix flake update\nnix flake update --flake ./modules/flake-parts/dev",
                    attr: "",
                    label: "",
                    version: ""
                  }
                ] + [ $result.updatable[] | { name: .name, title: "", attr: .attr, label: .label, version: .version, command: "" } ])
              }'
          )"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    name: Update ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: accept-flake-config = true

      - name: Configure git
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Reuse update branch
        env:
          BRANCH: auto-update/${{ matrix.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Reusing existing branch $BRANCH"
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
            if ! git rebase origin/main; then
              echo "::warning::Rebase of $BRANCH failed, recreating from main"
              git rebase --abort
              git switch -C "$BRANCH" origin/main
            fi
          else
            git switch -C "$BRANCH" origin/main
          fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Update flake locks
        if: matrix.command != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ${{ matrix.command }}

      - name: Update package
        if: matrix.attr != ''
        env:
          ATTR: ${{ matrix.attr }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NIX_PATH="nixpkgs=$(nix flake metadata --json --inputs-from . nixpkgs | jq -r .path)"
          export NIX_PATH
          nix shell nixpkgs#nix-update --inputs-from . -c nix-update --flake --use-update-script "$ATTR"

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet origin/main && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No changes for ${{ matrix.name }}"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      # A kernel bump can build cleanly while dsh skips bundles at runtime or
      # upstream drops rows and exports that downstream code still uses.
      - name: Report dsh-workspace impact
        id: impact
        if: steps.changes.outputs.updated == 'true' && matrix.name == 'dsh-workspace'
        run: |
          set -euo pipefail
          NIX_PATH="nixpkgs=$(nix flake metadata --json --inputs-from . nixpkgs | jq -r .path)"
          export NIX_PATH
          main="git+file://$PWD?rev=$(git rev-parse origin/main)"
          report="$RUNNER_TEMP/dsh-bump-report.md"
          scripts/dsh-bump-report.sh --fetch-sources \
            --old "$(nix build --no-link --print-out-paths "$main#dsh-workspace.src")" \
            --kernel "$main#dsh-kernel" \
            "$(nix build --no-link --print-out-paths .#dsh-workspace.src)" \
            >"$report"
          if awk '/^## Actions$/ { inside = 1; next } /^## / { inside = 0 } inside && /^- none$/ { found = 1 } END { exit !found }' "$report"; then
            echo "actions=false" >> "$GITHUB_OUTPUT"
          else
            echo "actions=true" >> "$GITHUB_OUTPUT"
          fi
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app-token
        if: steps.changes.outputs.updated == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open or update pull request
        if: steps.changes.outputs.updated == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: auto-update/${{ matrix.name }}
          TITLE: ${{ matrix.title }}
          IMPACT_REPORT: ${{ steps.impact.outputs.report }}
          IMPACT_ACTIONS: ${{ steps.impact.outputs.actions }}
        run: |
          set -euo pipefail

          if [ -n "${{ matrix.attr }}" ]; then
            old_version="${{ matrix.version }}"
            new_version="$(nix eval --raw --impure ".#${{ matrix.attr }}.version")"
            TITLE="${{ matrix.label }}: ${old_version} -> ${new_version}"
          fi

          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git add -A
            git commit -m "$TITLE"
          else
            echo "No new update changes; reusing rebased branch"
          fi
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin "HEAD:$BRANCH"

          body="Automated update. Package CI runs before auto-merge."
          if [ "${IMPACT_ACTIONS:-false}" = true ]; then
            body="Automated update. Auto-merge is off because the impact report lists downstream actions."
          fi
          if [ -n "${IMPACT_REPORT:-}" ]; then
            # GitHub limits a PR body to 65536 characters.
            body="$(printf '%s\n\n%s' "$body" "$(head -c 60000 "$IMPACT_REPORT")")"
          fi

          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$body"
          else
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base main \
                --head "$BRANCH" \
                --title "$TITLE" \
                --body "$body"
            )"
            pr_number="$(printf '%s\n' "$pr_url" | sed -n 's#.*/pull/\([0-9][0-9]*\).*#\1#p')"
          fi

          if [ "${IMPACT_ACTIONS:-false}" = true ]; then
            gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --disable-auto || true
          else
            gh pr merge "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --auto \
              --squash \
              --delete-branch
          fi
