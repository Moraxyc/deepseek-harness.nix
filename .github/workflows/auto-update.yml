name: Auto Update

on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      git-name: ${{ steps.app-identity.outputs.name }}
      git-email: ${{ steps.app-identity.outputs.email }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # fetchrix builds itself from source; the public cache carries its
          # Rust dependencies and output.
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://nix-cache.qaq.li/fetchrix
            extra-trusted-public-keys = fetchrix:VDPvJo80cjEoWiPDXAKKrNu3RXet40rlcXFZFvbsscM=

      - name: Build update matrix
        id: discover
        run: |
          set -euo pipefail

          result="$(
            nix eval --impure --json --expr '
              let
                f = import ./default.nix;
                system = builtins.currentSystem;
                lib = (builtins.getFlake ("git+file://" + toString ./.)).inputs.nixpkgs.lib;
                names = builtins.attrNames (lib.importTOML ./fetchrix.toml).packages;
                packageSet = builtins.getAttr system f.packages;
                bundleSet = (builtins.getAttr system f.legacyPackages).bundles;
                packageFor = label:
                  if lib.hasPrefix "bundles." label then
                    bundleSet.${lib.removePrefix "bundles." label}
                  else packageSet.${label};
                isBuildable = label:
                  let package = packageFor label;
                  in !((package.meta or { }).broken or false);
                skipped = builtins.filter (label: !isBuildable label) names;
                updatable = map (label: {
                  name = lib.removePrefix "bundles." label;
                  attr = if lib.hasPrefix "bundles." label then
                    "legacyPackages." + system + "." + label
                  else "packages." + system + "." + label;
                  inherit label;
                  version = (packageFor label).version or "";
                }) (builtins.filter isBuildable names);
              in
              {
                inherit skipped updatable;
              }
            '
          )"

          printf '%s\n' "$result" |
            jq -r '.skipped[] | "::warning::Skipping broken \(.) in the auto-update matrix"'

          matrix="$(
            jq -cn \
              --argjson result "$result" \
              '{
                include: ([
                  {
                    name: "flake-locks",
                    title: "chore: update flake locks",
                    command: "nix flake update\nnix flake update --flake ./modules/flake-parts/dev",
                    attr: "",
                    label: "",
                    version: ""
                  }
                ] + [ $result.updatable[] | { name: .name, title: "", attr: .attr, label: .label, version: .version, command: "" } ])
              }'
          )"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve GitHub App identity
        id: app-identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          login="${APP_SLUG}[bot]"
          user_id="$(gh api "/users/$login" --jq .id)"
          echo "name=$login" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${login}@users.noreply.github.com" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    name: Update ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # fetchrix builds itself from source; the public cache carries its
          # Rust dependencies and output.
          extra_nix_config: |
            accept-flake-config = true
            extra-substituters = https://nix-cache.qaq.li/fetchrix
            extra-trusted-public-keys = fetchrix:VDPvJo80cjEoWiPDXAKKrNu3RXet40rlcXFZFvbsscM=

      # The final main-branch run reuses these validation builds.
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'deepseek-harness-nix' }}
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Configure git
        env:
          GIT_NAME: ${{ needs.discover.outputs.git-name }}
          GIT_EMAIL: ${{ needs.discover.outputs.git-email }}
        run: |
          set -euo pipefail
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

      - name: Reuse update branch
        env:
          BRANCH: auto-update/${{ matrix.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Reusing existing branch $BRANCH"
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
            if ! git rebase origin/main; then
              echo "::warning::Rebase of $BRANCH failed, recreating from main"
              git rebase --abort
              git switch -C "$BRANCH" origin/main
            fi
          else
            git switch -C "$BRANCH" origin/main
          fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Update flake locks
        if: matrix.command != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ${{ matrix.command }}

      - name: Update package
        if: matrix.attr != ''
        env:
          LABEL: ${{ matrix.label }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nix develop -c fetchrix update "$LABEL"

      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet origin/main && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No changes for ${{ matrix.name }}"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test and update dshEngines grants
        id: compatibility
        if: steps.changes.outputs.updated == 'true' && (matrix.name == 'dsh-workspace' || startsWith(matrix.label, 'bundles.'))
        continue-on-error: true
        env:
          UPDATE_LABEL: ${{ matrix.label }}
          BUNDLE_NAME: ${{ matrix.name }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/dsh-engines-report.md"
          echo "report=$report" >> "$GITHUB_OUTPUT"
          args=()
          if [[ "$UPDATE_LABEL" == bundles.* ]]; then
            args+=("$BUNDLE_NAME")
          fi
          nix shell --inputs-from . nixpkgs#nodejs-slim nixpkgs#ast-grep \
            -c node scripts/update-dsh-engines.mjs "${args[@]}" \
            | tee "$report" -a "$GITHUB_STEP_SUMMARY"

      # A runtime bump can build cleanly while dsh skips bundles at runtime or
      # upstream drops rows and exports that downstream code still uses.
      - name: Report dsh-workspace impact
        id: impact
        if: steps.changes.outputs.updated == 'true' && matrix.name == 'dsh-workspace'
        run: |
          set -euo pipefail
          NIX_PATH="nixpkgs=$(nix flake metadata --json --inputs-from . nixpkgs | jq -r .path)"
          export NIX_PATH
          main="git+file://$PWD?rev=$(git rev-parse origin/main)"
          report="$RUNNER_TEMP/dsh-bump-report.md"
          scripts/dsh-bump-report.sh --fetch-sources \
            --old "$(nix build --no-link --print-out-paths "$main#dsh-workspace.src")" \
            --runtime "$main#dsh-runtime" \
            "$(nix build --no-link --print-out-paths .#dsh-workspace.src)" \
            >"$report"
          if awk '/^## Actions$/ { inside = 1; next } /^## / { inside = 0 } inside && /^- none$/ { found = 1 } END { exit !found }' "$report"; then
            echo "actions=false" >> "$GITHUB_OUTPUT"
          else
            echo "actions=true" >> "$GITHUB_OUTPUT"
          fi
          echo "report=$report" >> "$GITHUB_OUTPUT"

      - name: Commit update
        id: commit
        if: steps.changes.outputs.updated == 'true'
        env:
          LABEL: ${{ matrix.label }}
          ATTR: ${{ matrix.attr }}
          OLD_VERSION: ${{ matrix.version }}
          DEFAULT_TITLE: ${{ matrix.title }}
        run: |
          set -euo pipefail
          title="$DEFAULT_TITLE"
          if [ -n "$ATTR" ]; then
            new_version="$(nix eval --raw --impure ".#$ATTR.version")"
            title="$LABEL: $OLD_VERSION -> $new_version"
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git add -A
            # The dev shell installs the repository hooks. They guard local
            # pushes, and CI cannot satisfy the container check behind them.
            git commit --no-verify -m "$title"
          else
            echo "No new update changes; reusing rebased branch"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"

      # The container check needs the uid-range feature, which GitHub runners
      # cannot provide. Build what Package CI would build for the change instead.
      - name: Validate update
        id: validate
        if: steps.changes.outputs.updated == 'true'
        continue-on-error: true
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          attrs="$(scripts/select-package-ci-attrs.sh origin/main)"
          if [ -z "$attrs" ]; then
            echo "No changed package attrs"
            exit 0
          fi
          mapfile -t build_attrs <<< "$attrs"
          printf 'Building %d package attrs\n' "${#build_attrs[@]}"
          printf '%s\n' "${build_attrs[@]}"
          nix build --no-link --print-build-logs "${build_attrs[@]}"

          # A workspace bump regenerates the optional bundle manifest; the
          # build above cannot tell a stale manifest from a fresh one.
          if [ "${{ matrix.name }}" = dsh-workspace ]; then
            system="$(nix eval --raw --impure --expr builtins.currentSystem)"
            nix build --no-link --print-build-logs \
              ".#checks.$system.dsh-optional-bundles-generated"
          fi

      - name: Collect validated update
        id: collect
        if: >-
          steps.changes.outputs.updated == 'true' &&
          steps.validate.outcome == 'success' &&
          steps.compatibility.outcome != 'failure' &&
          steps.impact.outputs.actions != 'true'
        env:
          NAME: ${{ matrix.name }}
          TITLE: ${{ steps.commit.outputs.title }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/auto-update/$NAME"
          git bundle create "$RUNNER_TEMP/auto-update/$NAME/update.bundle" origin/main..HEAD
          jq -n --arg branch "auto-update/$NAME" --arg title "$TITLE" \
            '{branch: $branch, title: $title}' > "$RUNNER_TEMP/auto-update/$NAME/result.json"

      - name: Upload validated update
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: auto-update-${{ matrix.name }}
          path: ${{ runner.temp }}/auto-update/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Generate GitHub App Token
        id: app-token
        if: steps.changes.outputs.updated == 'true' && steps.collect.outcome == 'skipped'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open or update pull request
        if: steps.changes.outputs.updated == 'true' && steps.collect.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: auto-update/${{ matrix.name }}
          TITLE: ${{ steps.commit.outputs.title }}
          IMPACT_REPORT: ${{ steps.impact.outputs.report }}
          COMPATIBILITY_REPORT: ${{ steps.compatibility.outputs.report }}
          COMPATIBILITY_FAILED: ${{ steps.compatibility.outcome == 'failure' }}
          VALIDATION_FAILED: ${{ steps.validate.outcome == 'failure' }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # Runner Nix cannot run the container checks behind the repository
          # pre-push hook; Package CI validates the branch instead.
          git push --force --no-verify origin "HEAD:$BRANCH"

          if [ "${VALIDATION_FAILED:-false}" = true ]; then
            body="Automated update. Auto-merge is off because validation failed."
          elif [ "${COMPATIBILITY_FAILED:-false}" = true ]; then
            body="Automated update. Auto-merge is off because compatibility checks failed. / 兼容性检查失败，已关闭自动合并。"
          else
            body="Automated update. Auto-merge is off because the impact report lists downstream actions."
          fi
          if [ -n "${COMPATIBILITY_REPORT:-}" ]; then
            body="$(printf '%s\n\n%s' "$body" "$(head -c 4000 "$COMPATIBILITY_REPORT")")"
          fi
          if [ -n "${IMPACT_REPORT:-}" ]; then
            # GitHub limits a PR body to 65536 characters.
            body="$(printf '%s\n\n%s' "$body" "$(head -c 60000 "$IMPACT_REPORT")")"
          fi

          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$body"
          else
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base main \
                --head "$BRANCH" \
                --title "$TITLE" \
                --body "$body"
            )"
            pr_number="$(printf '%s\n' "$pr_url" | sed -n 's#.*/pull/\([0-9][0-9]*\).*#\1#p')"
          fi

          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --disable-auto

  publish:
    needs: [discover, update]
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download validated updates
        uses: actions/download-artifact@v8
        with:
          pattern: auto-update-*
          path: ${{ runner.temp }}/auto-updates
          merge-multiple: true

      - name: Check for validated updates
        id: collected
        run: |
          for result in "$RUNNER_TEMP"/auto-updates/*/result.json; do
            if [ -f "$result" ]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Checkout repository
        if: steps.collected.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Generate GitHub App Token
        id: app-token
        if: steps.collected.outputs.found == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Publish collected updates
        if: steps.collected.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_NAME: ${{ needs.discover.outputs.git-name }}
          GIT_EMAIL: ${{ needs.discover.outputs.git-email }}
        run: |
          set -euo pipefail
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          bash scripts/publish-auto-updates.sh "$RUNNER_TEMP/auto-updates"
