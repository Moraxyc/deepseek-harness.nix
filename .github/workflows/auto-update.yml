name: Auto Update

on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      git-name: ${{ steps.app-identity.outputs.name }}
      git-email: ${{ steps.app-identity.outputs.email }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Free disk space for Nix
        uses: wimpysworld/nothing-but-nix@v12

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # fetchrix builds itself from source; the public cache carries its
          # Rust dependencies and output.
          extra_nix_config: |
            accept-flake-config = true
            build-dir = /nix/build
            extra-substituters = https://nix-cache.qaq.li/fetchrix
            extra-trusted-public-keys = fetchrix:VDPvJo80cjEoWiPDXAKKrNu3RXet40rlcXFZFvbsscM=

      - name: Build update matrix
        id: discover
        run: |
          set -euo pipefail

          result="$(
            nix eval --impure --json --expr '
              let
                f = import ./default.nix;
                system = builtins.currentSystem;
                lib = (builtins.getFlake ("git+file://" + toString ./.)).inputs.nixpkgs.lib;
                names = builtins.attrNames (lib.importTOML ./fetchrix.toml).packages;
                packageSet = builtins.getAttr system f.packages;
                bundleSet = (builtins.getAttr system f.legacyPackages).bundles;
                packageFor = label:
                  if lib.hasPrefix "bundles." label then
                    bundleSet.${lib.removePrefix "bundles." label}
                  else packageSet.${label};
                isBuildable = label:
                  let package = packageFor label;
                  in !((package.meta or { }).broken or false);
                skipped = builtins.filter (label: !isBuildable label) names;
                updatable = map (label: {
                  name = lib.removePrefix "bundles." label;
                  attr = if lib.hasPrefix "bundles." label then
                    "legacyPackages." + system + "." + label
                  else "packages." + system + "." + label;
                  inherit label;
                  version = (packageFor label).version or "";
                  # A runtime bump carries downstream breakage that CI builds
                  # cannot see, so it only opens a pull request for review.
                  prOnly = label == "dsh-workspace";
                }) (builtins.filter isBuildable names);
              in
              {
                inherit skipped updatable;
              }
            '
          )"

          printf '%s\n' "$result" |
            jq -r '.skipped[] | "::warning::Skipping broken \(.) in the auto-update matrix"'

          matrix="$(
            jq -cn \
              --argjson result "$result" \
              '{
                include: ([
                  {
                    name: "flake-locks",
                    title: "chore: update flake locks",
                    command: "nix flake update\nnix flake update --flake ./modules/flake-parts/dev",
                    attr: "",
                    label: "",
                    version: "",
                    prOnly: false,
                    evalOnly: true
                  }
                ] + [ $result.updatable[] | { name: .name, title: "", attr: .attr, label: .label, version: .version, command: "", prOnly: .prOnly, evalOnly: false } ])
              }'
          )"

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve GitHub App identity
        id: app-identity
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail
          login="${APP_SLUG}[bot]"
          user_id="$(gh api "/users/$login" --jq .id)"
          echo "name=$login" >> "$GITHUB_OUTPUT"
          echo "email=${user_id}+${login}@users.noreply.github.com" >> "$GITHUB_OUTPUT"

  update:
    needs: discover
    name: Update ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space for Nix
        uses: wimpysworld/nothing-but-nix@v12

      - name: Install Nix
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          # fetchrix builds itself from source; the public cache carries its
          # Rust dependencies and output.
          extra_nix_config: |
            accept-flake-config = true
            build-dir = /nix/build
            extra-substituters = https://nix-cache.qaq.li/fetchrix
            extra-trusted-public-keys = fetchrix:VDPvJo80cjEoWiPDXAKKrNu3RXet40rlcXFZFvbsscM=

      # The final main-branch run reuses these validation builds.
      - name: Configure Cachix
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE_NAME || 'deepseek-harness-nix' }}
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # `cachix use` writes `substituters = ...` to the user config when missing,
      # overriding `/etc/nix/nix.conf`'s `extra-substituters`. Re-append it here.
      - name: Configure fetchrix cache
        run: |
          set -euo pipefail
          nix_conf="${XDG_CONFIG_HOME:-$HOME/.config}/nix/nix.conf"
          mkdir -p "$(dirname "$nix_conf")"
          cat >> "$nix_conf" <<'EOF'
          extra-substituters = https://nix-cache.qaq.li/fetchrix
          extra-trusted-public-keys = fetchrix:VDPvJo80cjEoWiPDXAKKrNu3RXet40rlcXFZFvbsscM=
          EOF

      - name: Configure git
        env:
          GIT_NAME: ${{ needs.discover.outputs.git-name }}
          GIT_EMAIL: ${{ needs.discover.outputs.git-email }}
        run: |
          set -euo pipefail
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"

      - name: Reuse update branch
        env:
          BRANCH: auto-update/${{ matrix.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Reusing existing branch $BRANCH"
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
            if ! git rebase origin/main; then
              echo "::warning::Rebase of $BRANCH failed, recreating from main"
              git rebase --abort
              git switch -C "$BRANCH" origin/main
            fi
          else
            git switch -C "$BRANCH" origin/main
          fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - name: Update flake locks
        id: locks
        if: matrix.command != ''
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ${{ matrix.command }}

      - name: Update package
        id: package
        if: matrix.attr != ''
        continue-on-error: true
        env:
          LABEL: ${{ matrix.label }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          nix develop -c fetchrix update "$LABEL"

      - name: Check for changes
        id: changes
        env:
          NAME: ${{ matrix.name }}
          UPDATE_FAILED: ${{ steps.package.outcome == 'failure' || steps.locks.outcome == 'failure' }}
        run: |
          set -euo pipefail
          placeholder=".github/auto-update-failures/$NAME.md"
          if [ "$UPDATE_FAILED" != true ]; then
            rm -f "$placeholder"
          elif [ -f "$placeholder" ] || { git diff --quiet origin/main && [ -z "$(git status --porcelain --untracked-files=all)" ]; }; then
            mkdir -p "$(dirname "$placeholder")"
            {
              printf '# Auto-update failed / 自动更新失败: %s\n\n' "$NAME"
              printf 'Update failed without generated changes; this file keeps a repair PR open. / 更新失败且未生成改动，此文件用于创建修复 PR。\n\n'
              printf '[Logs / 日志](%s/%s/actions/runs/%s/attempts/%s)\n\n' \
                "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
              printf 'Remove this file after repairing the update. / 修复更新后删除此文件。\n'
            } > "$placeholder"
            echo "placeholder=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Update failed; preserving a placeholder for a repair PR / 更新失败，生成占位文件以创建修复 PR"
          fi
          if git diff --quiet origin/main && [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "updated=false" >> "$GITHUB_OUTPUT"
            echo "No changes for $NAME"
          else
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit update
        id: commit
        if: steps.changes.outputs.updated == 'true'
        env:
          LABEL: ${{ matrix.label }}
          ATTR: ${{ matrix.attr }}
          OLD_VERSION: ${{ matrix.version }}
          DEFAULT_TITLE: ${{ matrix.title }}
          NAME: ${{ matrix.name }}
          PLACEHOLDER: ${{ steps.changes.outputs.placeholder }}
        run: |
          set -euo pipefail
          title="$DEFAULT_TITLE"
          if [ "$PLACEHOLDER" = true ]; then
            title="${LABEL:-$NAME}: repair failed auto-update"
          elif [ -n "$ATTR" ]; then
            new_version="$(jq -r --arg label "$LABEL" '.packages[$label].version' _sources/lock.json)"
            title="$LABEL: $OLD_VERSION -> $new_version"
          fi
          if [ -n "$(git status --porcelain --untracked-files=all)" ]; then
            git add -A
            # The dev shell installs the repository hooks. They guard local
            # pushes, and CI cannot satisfy the container check behind them.
            git commit --no-verify -m "$title"
          else
            echo "No new update changes; reusing rebased branch"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"

      # The container check needs the uid-range feature, which GitHub runners
      # cannot provide. Build what Package CI would build for the change instead,
      # except flake lock updates which only run evaluation here.
      - name: Validate update
        id: validate
        if: >-
          steps.changes.outputs.updated == 'true' && matrix.prOnly != true &&
          steps.package.outcome != 'failure' && steps.locks.outcome != 'failure'
        continue-on-error: true
        env:
          EVAL_ONLY: ${{ matrix.evalOnly }}
        run: |
          set -euo pipefail
          if [ "${EVAL_ONLY:-false}" = true ]; then
            # The flake-parts dev partition copies this path into the store.
            # Populate it before the read-only flake check on a clean runner.
            nix-store --add ./modules/flake-parts/dev >/dev/null
            nix flake check --no-build --all-systems
            system="$(nix eval --raw --impure --expr builtins.currentSystem)"
            mapfile -t eval_attrs < <(
              nix eval --json ".#legacyPackages.${system}.ciPackageAttrs" |
                jq -r '.packages[], .bundles[], .presets[], .bundleCompositions[]' |
                sort -u
            )
            printf 'Evaluating %d package attrs\n' "${#eval_attrs[@]}"
            nix path-info --derivation "${eval_attrs[@]}" >/dev/null
            exit 0
          fi
          git fetch --quiet origin main
          attrs="$(nix run .#tools.select-package-ci-attrs -- origin/main)"
          if [ -z "$attrs" ]; then
            echo "No changed package attrs"
            exit 0
          fi
          mapfile -t build_attrs <<< "$attrs"
          printf 'Building %d package attrs\n' "${#build_attrs[@]}"
          printf '%s\n' "${build_attrs[@]}"
          nix build --no-link --print-build-logs "${build_attrs[@]}"

      - name: Collect validated update
        id: collect
        if: >-
          steps.changes.outputs.updated == 'true' &&
          matrix.prOnly != true &&
          steps.package.outcome != 'failure' && steps.locks.outcome != 'failure' &&
          steps.validate.outcome == 'success'
        env:
          NAME: ${{ matrix.name }}
          TITLE: ${{ steps.commit.outputs.title }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/auto-update/$NAME"
          message="$(git log -1 --format=%B)"
          if [[ "$message" == *'[skip ci]'* ]]; then
            git commit --amend --no-verify -m "${message//\[skip ci\]/}"
          fi
          git bundle create "$RUNNER_TEMP/auto-update/$NAME/update.bundle" origin/main..HEAD
          jq -n --arg branch "auto-update/$NAME" --arg title "$TITLE" \
            '{branch: $branch, title: $title}' > "$RUNNER_TEMP/auto-update/$NAME/result.json"

      - name: Upload validated update
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: auto-update-${{ matrix.name }}
          path: ${{ runner.temp }}/auto-update/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Generate GitHub App Token
        id: app-token
        if: steps.changes.outputs.updated == 'true' && steps.collect.outcome == 'skipped'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Open or update pull request
        id: pull-request
        if: steps.changes.outputs.updated == 'true' && steps.collect.outcome == 'skipped'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: auto-update/${{ matrix.name }}
          TITLE: ${{ steps.commit.outputs.title }}
          PR_ONLY: ${{ matrix.prOnly }}
          PLACEHOLDER: ${{ steps.changes.outputs.placeholder }}
          UPDATE_FAILED: ${{ steps.package.outcome == 'failure' || steps.locks.outcome == 'failure' }}
          VALIDATION_FAILED: ${{ steps.validate.outcome == 'failure' }}
        run: |
          set -euo pipefail

          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if ! git log -1 --format=%B | grep -Fq '[skip ci]'; then
            git commit --amend --no-verify -m "$(git log -1 --format=%B)" -m '[skip ci]'
          fi
          git push --force --no-verify origin "HEAD:$BRANCH"

          if [ "${PLACEHOLDER:-false}" = true ]; then
            reason="Update command failed; a placeholder report is included. Remove it after repair. / 更新命令失败，已生成占位报告，修复后请删除。"
          elif [ "${UPDATE_FAILED:-false}" = true ]; then
            reason="Update command failed; generated changes are preserved. / 更新命令失败，已保留生成的改动。"
          elif [ "${PR_ONLY:-false}" = true ]; then
            reason="Runtime update requires downstream review. / 运行时更新需要检查下游兼容性。"
          else
            reason="Validation failed. / 验证失败。"
          fi
          body="$reason CI and auto-merge are off; manual repair required. / 不运行 CI，不自动合并，等待手动修复。"
          body="$(printf '%s\n\n%s' "$body" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}")"

          pr_number="$(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --head "$BRANCH" \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TITLE" \
              --body "$body"
          else
            pr_url="$(
              gh pr create \
                --repo "$GITHUB_REPOSITORY" \
                --base main \
                --head "$BRANCH" \
                --title "$TITLE" \
                --body "$body"
            )"
            pr_number="${pr_url##*/}"
          fi

          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --disable-auto
          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/$pr_number" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Record update result
        if: ${{ !cancelled() }}
        env:
          NAME: ${{ matrix.name }}
          RESULT: ${{ job.status }}
          UPDATED: ${{ steps.changes.outputs.updated }}
          COLLECTED: ${{ steps.collect.outcome }}
          PR_URL: ${{ steps.pull-request.outputs.url }}
          PR_REASON: ${{ steps.pull-request.outputs.reason }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/update-reports"
          {
            printf '### %s\n\n' "$NAME"
            if [ "$RESULT" = failure ]; then
              echo 'Failed; see job logs. / 失败，请查看任务日志。'
            elif [ -n "$PR_URL" ]; then
              printf '%s\n\n[PR](%s): CI and auto-merge off; manual repair required. / 不运行 CI，不自动合并，等待手动修复。\n' "$PR_REASON" "$PR_URL"
            elif [ "$COLLECTED" = success ]; then
              echo 'Validated; queued for publishing. / 验证通过，等待汇总发布。'
            elif [ "$UPDATED" = false ]; then
              echo 'No changes. / 无改动。'
            else
              echo 'Incomplete; see job logs. / 未完成，请查看任务日志。'
            fi
            printf '\n'
          } > "$RUNNER_TEMP/update-reports/$NAME.md"

      - name: Upload update result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: update-report-${{ matrix.name }}
          path: ${{ runner.temp }}/update-reports/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  publish:
    needs: [discover, update]
    if: ${{ !cancelled() && needs.discover.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: read
    steps:
      - name: Download update results
        uses: actions/download-artifact@v8
        with:
          pattern: update-report-*
          path: ${{ runner.temp }}/update-reports
          merge-multiple: true

      - name: Download validated updates
        uses: actions/download-artifact@v8
        with:
          pattern: auto-update-*
          path: ${{ runner.temp }}/auto-updates
          merge-multiple: true

      - name: Check for validated updates
        id: collected
        run: |
          for result in "$RUNNER_TEMP"/auto-updates/*/result.json; do
            if [ -f "$result" ]; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              break
            fi
          done

      - name: Checkout repository
        if: steps.collected.outputs.found == 'true'
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Free disk space for Nix
        if: steps.collected.outputs.found == 'true'
        uses: wimpysworld/nothing-but-nix@v12

      - name: Install Nix
        if: steps.collected.outputs.found == 'true'
        uses: cachix/install-nix-action@v32
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: build-dir = /nix/build

      - name: Generate GitHub App Token
        id: app-token
        if: steps.collected.outputs.found == 'true'
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Publish collected updates
        id: publish
        if: steps.collected.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_NAME: ${{ needs.discover.outputs.git-name }}
          GIT_EMAIL: ${{ needs.discover.outputs.git-email }}
          PUBLISH_REPORT: ${{ runner.temp }}/auto-update-publish.md
        run: |
          set -euo pipefail
          git config user.name "$GIT_NAME"
          git config user.email "$GIT_EMAIL"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          nix run .#tools.publish-auto-updates -- "$RUNNER_TEMP/auto-updates"

      - name: Summarize updates
        id: summary
        if: ${{ !cancelled() }}
        env:
          UPDATE_RESULT: ${{ needs.update.result }}
          PUBLISH_RESULT: ${{ steps.publish.outcome }}
        run: |
          set -euo pipefail
          {
            printf '## Auto Update / 自动更新\n\n'
            printf 'Update jobs / 更新任务: %s; publish / 发布: %s\n\n' "$UPDATE_RESULT" "$PUBLISH_RESULT"
            if [ -f "$RUNNER_TEMP/auto-update-publish.md" ]; then
              cat "$RUNNER_TEMP/auto-update-publish.md"
              printf '\n'
            fi
            for report in "$RUNNER_TEMP"/update-reports/*.md; do
              [ -f "$report" ] || continue
              cat "$report"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete intermediate update reports
        if: ${{ !cancelled() && steps.summary.outcome == 'success' }}
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { ...context.repo, run_id: context.runId, per_page: 100 },
            );
            for (const artifact of artifacts) {
              if (artifact.name.startsWith('update-report-')) {
                await github.rest.actions.deleteArtifact({
                  ...context.repo,
                  artifact_id: artifact.id,
                });
              }
            }
